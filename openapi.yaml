components:
  securitySchemes:
    JWT-auth:
      scheme: bearer
      bearerFormat: JWT
      type: http
      name: JWT
      description: Enter JWT token
      in: header
  schemas:
    AuthUserDto:
      type: object
      properties:
        id:
          type: string
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        email:
          type: string
          example: user@example.com
        fullName:
          type: object
          example: Nguyen Van A
          nullable: true
        role:
          type: string
          example: user
        actorType:
          type: string
          example: user
          enum:
            - user
            - staff
            - operator
            - admin
            - partner
            - guest
        availableRoles:
          example:
            - user
            - operator
          description: All available roles for this account
          type: array
          items:
            type: string
      required:
        - id
        - email
        - fullName
        - role
        - actorType
        - availableRoles
    TokenPairDto:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
      required:
        - accessToken
        - refreshToken
    AuthResponseDto:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthUserDto'
        tokens:
          $ref: '#/components/schemas/TokenPairDto'
      required:
        - user
        - tokens
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
          description: Email address
        phone:
          type: string
          example: '0901234567'
          description: Phone number starting with 0 or +84 (optional)
        fullName:
          type: string
          example: Nguyen Van A
          description: Full name
        password:
          type: string
          example: password123
          description: Password (minimum 8 characters)
      required:
        - email
        - fullName
        - password
    LoginDto:
      type: object
      properties:
        identifier:
          type: string
          example: user@example.com
          description: Email address or phone number (starting with 0 or +84) of the actor
        password:
          type: string
          example: password123
          description: Password (minimum 8 characters)
        actorType:
          type: string
          enum:
            - user
            - staff
            - operator
            - admin
            - partner
          description: Type of actor logging in. If not provided, system will auto-detect.
      required:
        - identifier
        - password
    GoogleAuthDto:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJSUzI1NiIs...
          description: Google OAuth access token from Supabase
      required:
        - accessToken
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: Refresh token obtained during login
      required:
        - refreshToken
    MessageResponseDto:
      type: object
      properties:
        message:
          type: string
          example: Operation successful
      required:
        - message
    ForgotPasswordDto:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
          description: Email address of the account
      required:
        - email
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          description: Password reset token received via email
        newPassword:
          type: string
          example: newPassword123
          description: New password (minimum 8 characters)
      required:
        - token
        - newPassword
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          example: currentPassword123
          description: Current password
        newPassword:
          type: string
          example: newPassword456
          description: New password (minimum 8 characters)
      required:
        - currentPassword
        - newPassword
    UserListItemDto:
      type: object
