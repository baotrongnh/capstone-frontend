          required: false
          in: query
          description: Minimum bedrooms
          schema:
            example: 1
            type: number
        - name: maxBedrooms
          required: false
          in: query
          description: Maximum bedrooms
          schema:
            example: 3
            type: number
        - name: minPrice
          required: false
          in: query
          description: Minimum rent
          schema:
            example: 5000000
            type: number
        - name: maxPrice
          required: false
          in: query
          description: Maximum rent
          schema:
            example: 20000000
            type: number
        - name: minArea
          required: false
          in: query
          description: Minimum area m²
          schema:
            example: 50
            type: number
        - name: maxArea
          required: false
          in: query
          description: Maximum area m²
          schema:
            example: 100
            type: number
        - name: furnishingStatus
          required: false
          in: query
          schema:
            type: string
            enum:
              - unfurnished
              - semi_furnished
              - fully_furnished
        - name: status
          required: false
          in: query
          schema:
            default: available
            type: string
            enum:
              - available
              - occupied
              - maintenance
              - reserved
              - inactive
        - name: page
          required: false
          in: query
          schema:
            default: 1
            example: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            default: 20
            example: 20
            type: number
        - name: sortBy
          required: false
          in: query
          schema:
            example: baseRentPrice
            type: string
            enum:
              - baseRentPrice
              - totalArea
              - createdAt
              - numberOfBedrooms
        - name: sortOrder
          required: false
          in: query
          schema:
            example: asc
            type: string
            enum:
              - asc
              - desc
      responses:
        '200':
          description: Paginated apartment search results
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 200
                  message:
                    type: string
                    example: Success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApartmentListItemDto'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-02-26T10:21:00.000Z'
                      total:
                        type: number
                        example: 25
                      page:
                        type: number
                        example: 1
                      limit:
                        type: number
                        example: 10
                      totalPages:
                        type: number
                        example: 3
      summary: Search apartments
      tags: &ref_4
        - Apartments
