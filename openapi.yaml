                    example: 201
                  message:
                    type: string
                    example: Success
                  data:
                    $ref: '#/components/schemas/ApartmentPolicyMutationResultDto'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-02-26T10:21:00.000Z'
        '404':
          description: Apartment or policy not found
        '409':
          description: Assignment already exists
      security:
        - JWT-auth: []
      summary: Assign policy to apartment
      tags: *ref_29
  /api/v1/apartment-policies/{id}:
    get:
      operationId: ApartmentPoliciesController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Apartment-policy assignment details
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 200
                  message:
                    type: string
                    example: Success
                  data:
                    $ref: '#/components/schemas/ApartmentPolicyDetailDto'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-02-26T10:21:00.000Z'
        '404':
          description: Assignment not found
      security:
        - JWT-auth: []
      summary: Get apartment-policy assignment details
      tags: *ref_29
    patch:
      operationId: ApartmentPoliciesController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApartmentPolicyDto'
      responses:
        '200':
          description: Assignment updated
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 200
                  message:
                    type: string
                    example: Success
                  data:
                    $ref: '#/components/schemas/ApartmentPolicyMutationResultDto'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-02-26T10:21:00.000Z'
        '404':
          description: Assignment not found
      security:
        - JWT-auth: []
      summary: Update apartment-policy assignment
      tags: *ref_29
    delete:
      operationId: ApartmentPoliciesController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Assignment removed
        '404':
          description: Assignment not found
      security:
        - JWT-auth: []
      summary: Remove policy from apartment
      tags: *ref_29
  /api/v1/apartment-policies/apartment/{apartmentId}:
    get:
      description: Get all policies assigned to a specific apartment. Public endpoint.
      operationId: ApartmentPoliciesController_findByApartment
      parameters:
        - name: apartmentId
          required: true
          in: path
          schema:
            type: string
        - name: isRequired
          required: false
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Apartment policies
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 200
                  message:
                    type: string
                    example: Success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApartmentPolicyDetailDto'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-02-26T10:21:00.000Z'
      summary: Get policies for an apartment
      tags: *ref_29
  /api/v1/apartment-policies/policy/{policyId}:
    get:
      description: Get all apartments that have a specific policy assigned
      operationId: ApartmentPoliciesController_findByPolicy
      parameters:
        - name: policyId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Policy apartment assignments
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 200
                  message:
                    type: string
                    example: Success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApartmentPolicyDetailDto'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        example: '2026-02-26T10:21:00.000Z'
      security:
        - JWT-auth: []
      summary: Get apartments with a specific policy
      tags: *ref_29
  /api/v1/apartment-policies/bulk-assign/{policyId}:
    post:
      description: Assign a policy to multiple apartments at once
      operationId: ApartmentPoliciesController_bulkAssign
      parameters:
        - name: policyId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                apartmentIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  example:
                    - a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    - b2c3d4e5-f6a7-8901-bcde-f12345678901
              required:
                - apartmentIds
      responses:
        '201':
          description: ''
      security:
        - JWT-auth: []
      summary: Bulk assign policy to apartments
      tags: *ref_29
