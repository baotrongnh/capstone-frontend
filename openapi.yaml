info:
  title: IntelliRentOps API
  description: Property Rental Management Platform API Documentation
  version: 1.0.0
  contact: {}
tags:
  - name: Authentication
    description: Authentication endpoints
  - name: Users
    description: User management endpoints
  - name: Apartments
    description: Apartment listing endpoints
  - name: Contracts
    description: Rental contract endpoints
  - name: Invoices
    description: Invoice and billing endpoints
  - name: Payments
    description: Payment processing endpoints
  - name: IoT
    description: IoT device control endpoints
  - name: Maintenance
    description: Maintenance request endpoints
  - name: Tickets
    description: Support ticket endpoints
  - name: Tasks
    description: Task management endpoints
  - name: Partners
    description: Partner & property request endpoints
  - name: Notifications
    description: Notification endpoints
  - name: Policies
    description: Policy & legal document endpoints
  - name: Activity Logs
    description: Audit trail endpoints
  - name: Viewing Requests
    description: Property viewing & appointment endpoints
servers: []
components:
  securitySchemes:
    JWT-auth:
      scheme: bearer
      bearerFormat: JWT
      type: http
      name: JWT
      description: Enter JWT token
      in: header
  schemas:
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
          description: Email address of the actor
        password:
          type: string
          example: password123
          description: Password (minimum 8 characters)
        actorType:
          type: string
          enum:
            - user
            - staff
            - operator
            - admin
            - partner
          description: Type of actor logging in. If not provided, system will auto-detect.
      required:
        - email
        - password
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: Refresh token obtained during login
      required:
        - refreshToken
    SubmitGuestInfoDto:
      type: object
      properties:
        phone:
          type: string
          example: '0901234567'
          description: Phone number of the guest (used for OTP verification)
        email:
          type: string
          example: guest@example.com
          description: Email address of the guest
        fullName:
          type: string
          example: Nguyen Van A
          description: Full name of the guest
        dateOfBirth:
          type: string
          example: '1990-05-15'
          description: Date of birth (ISO format)
        nationalId:
          type: string
          example: '012345678901'
          description: National ID number (CCCD)
        passportNumber:
          type: string
          example: A12345678
          description: Passport number
        emergencyContactName:
          type: string
          example: Nguyen Thi B
          description: Emergency contact name
        emergencyContactPhone:
          type: string
          example: '0909876543'
          description: Emergency contact phone
        notes:
          type: string
          example: Tenant for apartment 101, building A
          description: Additional notes from staff
      required:
        - phone
        - fullName
    RequestOtpDto:
      type: object
      properties:
        phone:
          type: string
          example: '0901234567'
          description: Phone number to receive OTP (must match pending registration)
      required:
        - phone
    VerifyOtpDto:
      type: object
      properties:
        phone:
          type: string
          example: '0901234567'
          description: Phone number used to request OTP
        otpCode:
          type: string
          example: '123456'
          description: 6-digit OTP code received via SMS
        password:
          type: string
          example: P@ssword123
          description: Password for the new account (minimum 8 characters)
      required:
        - phone
        - otpCode
        - password
    CreateUserDto:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
          description: Email address (must be unique)
        phone:
          type: string
          example: '0901234567'
          description: Phone number
